<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una carta para ti</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <div class="container">
    <button id="openBtn" class="open-btn" type="button">Abrir carta</button>

    <div id="letter" class="letter" aria-live="polite">
      <div class="envelope">
        <div class="flap"></div>
        <div class="letter-content">
          <div class="heart-shape">❤</div>
          <h1>Para ti</h1>
          <p>
            Solo quería recordarte que eres una persona muy especial para mí.
          </p>
          <p>
            Espero que tengas una linda noche y que nunca olvides lo mucho que vales.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
